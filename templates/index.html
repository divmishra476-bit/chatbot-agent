<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #333;
        }
        #chat-box {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .message {
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .user-msg {
            color: #0066cc;
            font-weight: bold;
        }
        .agent-msg {
            color: #666;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        code {
            background: #f0f0f0;
            padding: 2px 4px;
            border-radius: 2px;
            font-family: monospace;
        }
        pre {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 5px 0;
        }
        .typing {
            color: #999;
            font-style: italic;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            padding: 10px 20px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0052a3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Agent</h1>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Command the agent...">
            <button onclick="sendCommand()" id="send-btn">Send</button>
        </div>
    </div>

    <script>
        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendCommand();
        });

        async function sendCommand() {
            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const button = document.getElementById("send-btn");
            const command = input.value;

            if (!command) return;

            // Display user command
            chatBox.innerHTML += `<div class="message user-msg">You: ${command}</div>`;
            input.value = "";
            button.disabled = true;

            // Show typing indicator
            chatBox.innerHTML += `<div class="message typing" id="typing">Agent is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Send to Flask backend
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: command})
                });

                const data = await response.json();
                
                // Remove typing indicator
                document.getElementById("typing").remove();

                // Format the response with proper line breaks and code formatting
                let formattedReply = data.reply
                    .replace(/\n/g, "<br>")  // Convert newlines to <br>
                    .replace(/```/g, "<pre><code>")  // Code blocks start
                    .replace(/```/g, "</code></pre>");  // Code blocks end

                // Display agent response
                chatBox.innerHTML += `<div class="message agent-msg">${formattedReply}</div>`;
                
            } catch (error) {
                document.getElementById("typing").remove();
                chatBox.innerHTML += `<div class="message" style="color: #dc3545;">Error: ${error}</div>`;
            }

            button.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
            input.focus();
        }
    </script>
</body>
</html>
